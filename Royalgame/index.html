<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Royal Clash - A 1v1 real-time strategy browser game. Deploy Knights, Archers and Giants to destroy the enemy King Tower!">
  <title>Royal Clash</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #1e0f3c 0%, #06060f 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100vh; font-family: monospace; user-select: none;
    }
    #gameCanvas {
      display: block;
      width: 480px; height: 800px;
      max-height: 95vh; max-width: 100vw;
      aspect-ratio: 480 / 800;
      box-shadow: 0 0 0 2px rgba(100,140,255,0.22),
                  0 0 32px rgba(80,120,255,0.38),
                  0 0 72px rgba(60,80,200,0.14);
      border-radius: 3px;
      image-rendering: pixelated;
    }
    #hint {
      color: rgba(255,255,255,0.30); font-size: 11px; line-height: 1.8;
      margin-top: 9px; text-align: center; letter-spacing: 0.05em;
    }
    #hint b { color: rgba(255,255,255,0.52); }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="480" height="800"></canvas>
  <p id="hint">
    <b>1</b> <b>2</b> <b>3</b> or scroll to pick card &nbsp;&bull;&nbsp;
    Click card to select &nbsp;&bull;&nbsp;
    Click <em>your half</em> to deploy &nbsp;&bull;&nbsp;
    <b>R</b> to restart
  </p>
<script>
/* ============================================================
   ROYAL CLASH  --  single-file HTML5 Canvas port of main.py
   Exact 1-to-1 translation of all Python/Pygame logic.
   Structure mirrors the Python source:
     1. Constants / CONFIG
     2. Entity base class
     3. Tower subclasses
     4. Unit subclasses  (lane system + tower avoidance)
     5. AI Controller
     6. Drawing helpers
     7. Game State   (PLAYING -> GAME_OVER state machine)
     8. Main loop
   ============================================================ */

// ============================================================
// 1. CONSTANTS / CONFIG  (edit here to balance-tune)
// ============================================================
const SCREEN_W = 480, SCREEN_H = 800;
const FPS_MAX_DT = 1 / 30;   // cap dt to survive tab switches

const RIVER_TOP    = SCREEN_H / 2 - 30;  // 370
const RIVER_BOTTOM = SCREEN_H / 2 + 30;  // 430
const RIVER_MID    = SCREEN_H / 2;       // 400
const BRIDGE_LEFT_X  = SCREEN_W / 4;     // 120
const BRIDGE_RIGHT_X = 3 * SCREEN_W / 4; // 360
const BRIDGE_W       = 60;
const AI_HALF_TOP    = 20;
const AI_HALF_BOTTOM = RIVER_TOP;        // 370

const ELIXIR_MAX        = 10;
const ELIXIR_START      = 5;
const ELIXIR_REGEN_RATE = 1.0 / 1.4;   // elixir per second  <- tune here

// All balance numbers in one registry -- edit here, nowhere else
const CONFIG = {
  KingTower:     { hp:2400, damage:80,  attackRange:120, attackCooldown:1.2, width:60, height:60 },
  PrincessTower: { hp:1400, damage:45,  attackRange:160, attackCooldown:0.8, width:44, height:44 },
  Knight: { hp:600,  damage:80,  speed:90, attackRange:28,  attackCooldown:1.0, radius:16, elixirCost:3 },
  Archer: { hp:250,  damage:55,  speed:75, attackRange:120, attackCooldown:0.9, radius:12, elixirCost:3 },
  Giant:  { hp:1800, damage:120, speed:50, attackRange:30,  attackCooldown:1.5, radius:22, elixirCost:5 },
};

// Colours (matching Python RGB tuples exactly)
const C = {
  BG:       "#3c7828",
  RIVER:    "#64b4dc",
  BRIDGE:   "#b49659",
  PLAYER:   "#3278dc",  PLAYER_D: "#143c8c",
  AI:       "#d23232",  AI_D:     "#821414",
  HP_OK:    "#28d228",  HP_WARN:  "#dcc81e", HP_LOW: "#dc2828",
  ELIXIR:   "#be3cc8",  ELIX_BG:  "#3c1446",
  WHITE:    "#ffffff",  BLACK:    "#000000",
  GOLD:     "#ffd23c",  RED:      "#ff0000",
  GRID:     "rgba(50,110,35,0.55)",
};

const STATE_PLAYING   = "PLAYING";
const STATE_GAME_OVER = "GAME_OVER";

// ============================================================
// Tiny helpers
// ============================================================
const hypot = Math.hypot;
function randInt(a, b)    { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr)        { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

// Rounded-rect path helper (avoids ctx.roundRect for older Safari compat)
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x+w, y,   x+w, y+r);
  ctx.lineTo(x + w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x,   y+h, x,   y+h-r);
  ctx.lineTo(x, y + r);     ctx.quadraticCurveTo(x,   y,   x+r, y);
  ctx.closePath();
}

// ============================================================
// 2. ENTITY  --  shared base for Towers and Units
// ============================================================
class Entity {
  constructor(x, y, hp, team) {
    this.x = x; this.y = y;
    this.hp = hp; this.maxHp = hp;
    this.team = team;   // "player" | "ai"
    this.alive = true;
  }
  get color()     { return this.team === "player" ? C.PLAYER   : C.AI;    }
  get darkColor() { return this.team === "player" ? C.PLAYER_D : C.AI_D;  }

  takeDamage(amt) {
    this.hp = Math.max(0, this.hp - amt);
    if (this.hp <= 0) this.alive = false;
  }

  hpFrac() { return this.maxHp > 0 ? Math.max(0, this.hp / this.maxHp) : 0; }
  hpBarColor() {
    const f = this.hpFrac();
    return f > 0.6 ? C.HP_OK : f > 0.3 ? C.HP_WARN : C.HP_LOW;
  }

  drawHpBar(ctx, bx, by, bw = 40, bh = 5) {
    ctx.fillStyle = C.BLACK; ctx.fillRect(bx, by, bw, bh);
    const filled = Math.floor(bw * this.hpFrac());
    if (filled > 0) { ctx.fillStyle = this.hpBarColor(); ctx.fillRect(bx, by, filled, bh); }
    ctx.strokeStyle = C.WHITE; ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw, bh);
  }
}

// ============================================================
// 3. TOWERS  (stationary, auto-attack nearest enemy in range)
//    DESIGN CHOICE: KingTower is ALWAYS active from game start.
// ============================================================
class Tower extends Entity {
  constructor(x, y, kind, team) {
    const c = CONFIG[kind];
    super(x, y, c.hp, team);
    this.kind = kind;
    this.damage         = c.damage;
    this.attackRange    = c.attackRange;
    this.attackCooldown = c.attackCooldown;
    this.width          = c.width;
    this.height         = c.height;
    this.attackTimer    = 0;
  }

  // Axis-aligned bounding box (plain object, mirrors Python pygame.Rect)
  get rect() {
    return {
      left:   this.x - this.width  / 2,
      top:    this.y - this.height / 2,
      right:  this.x + this.width  / 2,
      bottom: this.y + this.height / 2,
    };
  }

  update(dt, enemies) {
    if (!this.alive) return;
    this.attackTimer = Math.max(0, this.attackTimer - dt);
    if (this.attackTimer === 0) {
      const t = this._nearestInRange(enemies);
      if (t) { t.takeDamage(this.damage); this.attackTimer = this.attackCooldown; }
    }
  }

  _nearestInRange(enemies) {
    let best = null, bd = Infinity;
    for (const e of enemies) {
      if (!e.alive) continue;
      const d = hypot(e.x - this.x, e.y - this.y);
      if (d <= this.attackRange && d < bd) { best = e; bd = d; }
    }
    return best;
  }

  draw(ctx) {
    if (!this.alive) return;
    const r = this.rect;
    // Drop shadow
    ctx.fillStyle = this.darkColor;
    ctx.fillRect(r.left - 2, r.top - 2, this.width + 4, this.height + 4);
    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(r.left, r.top, this.width, this.height);
    // Battlements
    ctx.fillStyle = this.darkColor;
    for (let i = 0; i < 3; i++)
      ctx.fillRect(r.left + 6 + i * Math.floor(this.width/3), r.top - 6, 10, 8);
    // K / P label
    ctx.fillStyle = C.WHITE; ctx.font = "13px monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(this.kind === "KingTower" ? "K" : "P", this.x, this.y);
    // HP bar above tower
    this.drawHpBar(ctx, r.left, r.top - 10, this.width, 6);
  }
}

class KingTower     extends Tower { constructor(x,y,t){ super(x,y,"KingTower",    t); } }
class PrincessTower extends Tower { constructor(x,y,t){ super(x,y,"PrincessTower",t); } }

// ============================================================
// 4. UNITS  (mobile combatants with lane system + avoidance)
// ============================================================
class Unit extends Entity {
  static AGGRO_RANGE = 200;  // pixel radius for automatic target acquisition

  constructor(x, y, kind, team) {
    const c = CONFIG[kind];
    super(x, y, c.hp, team);
    this.kind           = kind;
    this.damage         = c.damage;
    this.speed          = c.speed;
    this.attackRange    = c.attackRange;
    this.attackCooldown = c.attackCooldown;
    this.radius         = c.radius;
    this.attackTimer    = 0;
    this.target         = null;  // current Entity target
    // Lane system: left (0) or right (1) decided at spawn by X position.
    // Units route through the nearest bridge before entering enemy territory.
    this.lane      = x <= SCREEN_W / 2 ? 0 : 1;
    this.waypoints = this._buildWaypoints(team);
    this.wpIdx     = 0;  // index of next waypoint to consume
  }

  // Two river-crossing waypoints: approach river edge, exit other side.
  // Once both consumed the unit navigates freely toward its target.
  _buildWaypoints(team) {
    const bx = this.lane === 0 ? BRIDGE_LEFT_X : BRIDGE_RIGHT_X;
    return team === "player"
      ? [[bx, RIVER_BOTTOM - 15], [bx, RIVER_TOP + 15]]   // player moves up (y--)
      : [[bx, RIVER_TOP  + 15],   [bx, RIVER_BOTTOM - 15]]; // AI moves down (y++)
  }

  // Base targeting: nearest enemy unit in aggro range, else nearest tower.
  // Overridden by Giant to always target towers only.
  _findTarget(enemyUnits, enemyTowers) {
    const u = this._nearestAlive(enemyUnits);
    if (u && hypot(u.x - this.x, u.y - this.y) <= Unit.AGGRO_RANGE) return u;
    return this._nearestAlive(enemyTowers);
  }

  _nearestAlive(entities) {
    let best = null, bd = Infinity;
    for (const e of entities) {
      if (!e.alive) continue;
      const d = hypot(e.x - this.x, e.y - this.y);
      if (d < bd) { best = e; bd = d; }
    }
    return best;
  }

  update(dt, enemyUnits, enemyTowers, allUnits, allTowers = []) {
    if (!this.alive) return;
    // Guard: clear dead target to force re-acquisition (null-error guard)
    if (this.target !== null && !this.target.alive) this.target = null;
    this.target = this._findTarget(enemyUnits, enemyTowers);
    this.attackTimer = Math.max(0, this.attackTimer - dt);

    if (this.target !== null) {
      const dist = hypot(this.target.x - this.x, this.target.y - this.y);
      if (dist <= this.attackRange) {
        // In attack range: stop and strike
        if (this.attackTimer === 0) {
          this.target.takeDamage(this.damage);
          this.attackTimer = this.attackCooldown;
        }
      } else {
        // Not in range: follow lane waypoints, then move freely to target
        if (this.wpIdx < this.waypoints.length) {
          const [wx, wy] = this.waypoints[this.wpIdx];
          if (hypot(wx - this.x, wy - this.y) < 25) {
            this.wpIdx++;  // waypoint reached, advance
          } else {
            this._moveToward(wx, wy, dt);
          }
        } else {
          // All waypoints consumed: head straight for target
          this._moveToward(this.target.x, this.target.y, dt);
        }
      }
    }
    // Tower avoidance and unit separation applied every frame
    if (allTowers.length > 0) this._avoidTowers(allTowers, dt);
    this._separate(allUnits);
  }

  // Move toward (tx,ty); division-by-zero guard when dist < 0.5
  _moveToward(tx, ty, dt) {
    const dx = tx - this.x, dy = ty - this.y;
    const d  = hypot(dx, dy);
    if (d < 0.5) return;  // zero-dist guard
    this.x += (dx / d) * this.speed * dt;
    this.y += (dy / d) * this.speed * dt;
  }

  // Soft radius push-back so units cannot fully pile on each other
  _separate(allUnits) {
    for (const o of allUnits) {
      if (o === this || !o.alive) continue;
      const dx = this.x - o.x, dy = this.y - o.y;
      const d  = hypot(dx, dy);
      const mn = this.radius + o.radius;
      if (d > 0.1 && d < mn) {  // zero-dist guard
        const ov = (mn - d) / 2;
        this.x += (dx / d) * ov;
        this.y += (dy / d) * ov;
      }
    }
  }

  // Closest-point-on-rect avoidance steering.
  // Skips the current attack target so units can still walk up to strike it.
  // Tune ADIST and ASPEED to change how wide a berth units give towers.
  _avoidTowers(towers, dt) {
    const ADIST  = this.radius + 40;    // activation distance from rect edge
    const ASPEED = this.speed * 1.5;    // max lateral push speed (px/sec)
    for (const t of towers) {
      if (!t.alive || t === this.target) continue;
      const r  = t.rect;
      // Closest point on the tower AABB to this unit centre
      const cx = clamp(this.x, r.left, r.right);
      const cy = clamp(this.y, r.top,  r.bottom);
      const dx = this.x - cx, dy = this.y - cy;
      const d  = hypot(dx, dy);
      if (d > 0.1 && d < ADIST) {  // zero-dist guard
        const str = (ADIST - d) / ADIST;  // 0..1
        this.x += (dx / d) * ASPEED * str * dt;
        this.y += (dy / d) * ASPEED * str * dt;
      }
    }
  }

  draw(ctx) {
    if (!this.alive) return;
    const ix = Math.round(this.x), iy = Math.round(this.y);
    // Drop shadow
    ctx.fillStyle = this.darkColor;
    ctx.beginPath(); ctx.arc(ix+2, iy+2, this.radius, 0, Math.PI*2); ctx.fill();
    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(ix, iy, this.radius, 0, Math.PI*2); ctx.fill();
    // White outline
    ctx.strokeStyle = C.WHITE; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ix, iy, this.radius, 0, Math.PI*2); ctx.stroke();
    // Unit-type initial letter
    const fs = Math.max(8, Math.floor(this.radius * 1.6));
    ctx.fillStyle = C.WHITE; ctx.font = `bold ${fs}px monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(this.kind[0], ix, iy);
    // HP bar above unit
    const bw = this.radius * 2 + 4;
    this.drawHpBar(ctx, ix - bw/2, iy - this.radius - 12, bw, 5);
  }
}

// Knight -- melee, targets nearest unit > nearest tower
class Knight extends Unit { constructor(x,y,t){ super(x,y,"Knight",t); } }
// Archer -- ranged, same targeting priority as Knight
class Archer extends Unit { constructor(x,y,t){ super(x,y,"Archer",t); } }
// Giant  -- tanky slow, targets TOWERS ONLY (ignores units even when attacked)
class Giant  extends Unit {
  constructor(x,y,t){ super(x,y,"Giant",t); }
  _findTarget(eu, et) { return this._nearestAlive(et); }   // towers only
}

// ============================================================
// 5. AI CONTROLLER  (probabilistic; 70% deploy, Giant-bias at 5+ elixir)
// ============================================================
class AIController {
  constructor() {
    this.INTERVAL = 2.0;  // seconds between decisions  <- tune here
    this.timer    = this.INTERVAL;
  }

  update(dt, elixir, spawnCb, aiTowers) {
    this.timer -= dt;
    if (this.timer > 0) return elixir;
    this.timer = this.INTERVAL;

    const cards = [
      [Knight, CONFIG.Knight.elixirCost],
      [Archer, CONFIG.Archer.elixirCost],
      [Giant,  CONFIG.Giant.elixirCost ],
    ];
    const affordable = cards.filter(([,cost]) => elixir >= cost);
    if (!affordable.length) return elixir;
    if (Math.random() > 0.70) return elixir;  // 30% chance to hold

    let cls, cost;
    if (elixir >= CONFIG.Giant.elixirCost && Math.random() < 0.50) {
      cls = Giant; cost = CONFIG.Giant.elixirCost;  // prefer Giant when flush
    } else {
      [cls, cost] = pick(affordable);
    }
    const [sx, sy] = this._randomSpawn(aiTowers);
    spawnCb(cls, sx, sy, "ai");
    return elixir - cost;
  }

  _randomSpawn(aiTowers, attempts = 20) {
    for (let i = 0; i < attempts; i++) {
      const x = randInt(30, SCREEN_W - 30);
      const y = randInt(AI_HALF_TOP + 20, AI_HALF_BOTTOM - 20);
      const clear = aiTowers.every(t => {
        if (!t.alive) return true;
        const r = t.rect;
        return !(x >= r.left-10 && x <= r.right+10 && y >= r.top-10 && y <= r.bottom+10);
      });
      if (clear) return [x, y];
    }
    return [SCREEN_W / 2, (AI_HALF_TOP + AI_HALF_BOTTOM) / 2];
  }
}

// ============================================================
// 6. DRAWING HELPERS
// ============================================================
function drawBackground(ctx) {
  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  // Subtle field grid
  ctx.strokeStyle = C.GRID; ctx.lineWidth = 1;
  for (let gy = 0; gy < SCREEN_H; gy += 80) {
    ctx.beginPath(); ctx.moveTo(0, gy);   ctx.lineTo(SCREEN_W, gy); ctx.stroke();
  }
  for (let gx = 0; gx < SCREEN_W; gx += 80) {
    ctx.beginPath(); ctx.moveTo(gx, 0);   ctx.lineTo(gx, SCREEN_H); ctx.stroke();
  }
  // River band
  ctx.fillStyle = C.RIVER;
  ctx.fillRect(0, RIVER_TOP, SCREEN_W, RIVER_BOTTOM - RIVER_TOP);
  // Bridge lanes with plank details
  for (const bx of [BRIDGE_LEFT_X, BRIDGE_RIGHT_X]) {
    ctx.fillStyle = C.BRIDGE;
    ctx.fillRect(bx - BRIDGE_W/2, RIVER_TOP, BRIDGE_W, RIVER_BOTTOM - RIVER_TOP);
    ctx.strokeStyle = "rgba(120,90,50,0.45)"; ctx.lineWidth = 2;
    for (let py = RIVER_TOP + 6; py < RIVER_BOTTOM; py += 10) {
      ctx.beginPath();
      ctx.moveTo(bx - BRIDGE_W/2 + 3, py); ctx.lineTo(bx + BRIDGE_W/2 - 3, py);
      ctx.stroke();
    }
  }
  // Dashed centre-river divider
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1;
  ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(0, RIVER_MID); ctx.lineTo(SCREEN_W, RIVER_MID); ctx.stroke();
  ctx.setLineDash([]);
}

function drawElixirBar(ctx, elixir, x, y) {
  const bw = 240, bh = 20, pipW = bw / ELIXIR_MAX;
  rrect(ctx, x, y, bw, bh, 4); ctx.fillStyle = C.ELIX_BG; ctx.fill();
  for (let i = 0; i < ELIXIR_MAX; i++) {
    ctx.fillStyle = i < Math.floor(elixir) ? C.ELIXIR
                  : i < elixir             ? "#783082" : "#28102d";
    ctx.fillRect(x + i*pipW+1, y+1, pipW-2, bh-2);
  }
  ctx.strokeStyle = C.WHITE; ctx.lineWidth = 2;
  rrect(ctx, x, y, bw, bh, 4); ctx.stroke();
  ctx.fillStyle = C.WHITE; ctx.font = "13px monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(`Elixir: ${Math.floor(elixir)}/${ELIXIR_MAX}`, x + bw + 6, y + bh/2);
}

function drawCardButtons(ctx, cards, selectedIdx, playerElixir, flashInvalid) {
  const cW = 90, cH = 80;
  const totalW = cards.length * cW + (cards.length - 1) * 10;
  const sx = (SCREEN_W - totalW) / 2;
  const bY = SCREEN_H - cH - 10;

  cards.forEach(([name, , cost], i) => {
    const cx  = sx + i * (cW + 10);
    const aff = playerElixir >= cost;
    const sel = i === selectedIdx;
    // Card background
    ctx.fillStyle = aff ? "#28406a" : "#282832";
    rrect(ctx, cx, bY, cW, cH, 6); ctx.fill();
    // Selected: gold glow border
    if (sel) {
      ctx.strokeStyle = C.GOLD; ctx.lineWidth = 3;
      rrect(ctx, cx-3, bY-3, cW+6, cH+6, 8); ctx.stroke();
    } else if (!aff) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      rrect(ctx, cx, bY, cW, cH, 6); ctx.fill();
    }
    // Unit preview circle
    ctx.fillStyle = aff ? C.PLAYER : "#505060";
    ctx.beginPath(); ctx.arc(cx + cW/2, bY+28, 18, 0, Math.PI*2); ctx.fill();
    // Unit initial
    ctx.fillStyle = C.WHITE; ctx.font = "bold 14px monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(name[0], cx + cW/2, bY+28);
    // Card name
    ctx.fillStyle = aff ? C.WHITE : "#787882"; ctx.font = "12px monospace";
    ctx.fillText(name, cx + cW/2, bY+54);
    // Elixir cost badge
    ctx.fillStyle = aff ? C.ELIXIR : "#643c6e";
    ctx.font = "bold 15px monospace"; ctx.textAlign = "right";
    ctx.fillText(String(cost), cx + cW - 5, bY+14);
  });

  // Red flash for invalid placement attempts
  if (flashInvalid) {
    ctx.fillStyle = C.RED; ctx.font = "bold 17px monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText("Invalid placement!", SCREEN_W/2, RIVER_BOTTOM + 10);
  }
}

function drawHud(ctx, playerElixir, aiElixir, cards, selectedIdx, flashInvalid, elapsed) {
  // Semi-transparent HUD strip at bottom
  ctx.fillStyle = "rgba(10,10,20,0.72)";
  ctx.fillRect(0, SCREEN_H - 110, SCREEN_W, 110);
  drawElixirBar(ctx, playerElixir, 10, SCREEN_H - 108);
  drawElixirBar(ctx, aiElixir,     10, 4);
  drawCardButtons(ctx, cards, selectedIdx, playerElixir, flashInvalid);
  // Match timer
  const mm = String(Math.floor(elapsed / 60)).padStart(2,"0");
  const ss = String(Math.floor(elapsed % 60)).padStart(2,"0");
  ctx.fillStyle = C.WHITE; ctx.font = "bold 26px monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillText(`${mm}:${ss}`, SCREEN_W/2, 5);
}

function drawGameOver(ctx, playerWon) {
  ctx.fillStyle = "rgba(0,0,0,0.62)"; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const col = playerWon ? C.GOLD : C.RED;
  const msg = playerWon ? "VICTORY!" : "DEFEAT";
  ctx.shadowColor = playerWon ? "rgba(255,210,60,0.65)" : "rgba(255,0,0,0.65)";
  ctx.shadowBlur  = 28;
  ctx.fillStyle   = col; ctx.font = "bold 62px monospace";
  ctx.fillText(msg, SCREEN_W/2, SCREEN_H/2 - 44);
  ctx.shadowBlur  = 0;
  ctx.fillStyle = C.WHITE; ctx.font = "bold 26px monospace";
  ctx.fillText("Press R to Restart", SCREEN_W/2, SCREEN_H/2 + 22);
}

// ============================================================
// 7. GAME STATE  (state machine: PLAYING -> GAME_OVER)
// ============================================================
class GameState {
  constructor() {
    this.CARDS = [
      ["Knight", Knight, CONFIG.Knight.elixirCost],
      ["Archer", Archer, CONFIG.Archer.elixirCost],
      ["Giant",  Giant,  CONFIG.Giant.elixirCost ],
    ];
    this.reset();
  }

  reset() {
    this.state        = STATE_PLAYING;
    this.playerElixir = ELIXIR_START;
    this.aiElixir     = ELIXIR_START;
    this.elapsedTime  = 0;
    this.selectedCard = 0;
    this.flashInvalid = false;
    this.flashTimer   = 0;
    this.playerWon    = false;
    const W = SCREEN_W, H = SCREEN_H;
    // Tower placement mirrors Python version exactly
    this.playerKing   = new KingTower(W/2,      H-60,  "player");
    this.playerTowerL = new PrincessTower(W/4,   H-160, "player");
    this.playerTowerR = new PrincessTower(3*W/4, H-160, "player");
    this.aiKing       = new KingTower(W/2,      60,    "ai");
    this.aiTowerL     = new PrincessTower(W/4,   160,   "ai");
    this.aiTowerR     = new PrincessTower(3*W/4, 160,   "ai");
    this.playerTowers = [this.playerKing,  this.playerTowerL, this.playerTowerR];
    this.aiTowers     = [this.aiKing,      this.aiTowerL,     this.aiTowerR    ];
    this.playerUnits  = [];
    this.aiUnits      = [];
    this.aiCtrl       = new AIController();
  }

  spawnUnit(UnitClass, x, y, team) {
    const u = new UnitClass(x, y, team);
    (team === "player" ? this.playerUnits : this.aiUnits).push(u);
  }

  _regenElixir(dt) {
    // Clamp to [0, ELIXIR_MAX] -- guards both negative and overflow
    this.playerElixir = clamp(this.playerElixir + ELIXIR_REGEN_RATE * dt, 0, ELIXIR_MAX);
    this.aiElixir     = clamp(this.aiElixir     + ELIXIR_REGEN_RATE * dt, 0, ELIXIR_MAX);
  }

  // --- Input handlers ---

  handleClick(mx, my) {
    if (this.state === STATE_GAME_OVER) return;
    // Check if clicking a card button to select it (bonus web UX)
    const cW = 90, cH = 80;
    const totalW = this.CARDS.length * cW + (this.CARDS.length - 1) * 10;
    const bY = SCREEN_H - cH - 10;
    const sx = (SCREEN_W - totalW) / 2;
    for (let i = 0; i < this.CARDS.length; i++) {
      const cx = sx + i * (cW + 10);
      if (mx >= cx && mx <= cx+cW && my >= bY && my <= bY+cH) {
        this.selectedCard = i; return;
      }
    }
    this._tryDeploy(mx, my);
  }

  handleKeydown(e) {
    if (this.state === STATE_GAME_OVER) {
      if (e.key === "r" || e.key === "R") this.reset();
      return;
    }
    if (e.key === "1") this.selectedCard = 0;
    if (e.key === "2") this.selectedCard = 1;
    if (e.key === "3") this.selectedCard = 2;
  }

  handleWheel(e) {
    if (this.state === STATE_GAME_OVER) return;
    const dir = e.deltaY > 0 ? 1 : -1;
    this.selectedCard = (this.selectedCard + dir + this.CARDS.length) % this.CARDS.length;
  }

  _tryDeploy(mx, my) {
    // Invalid if: above river, inside HUD strip, or on a tower bounding box
    if (my <= RIVER_BOTTOM) { this._showInvalid(); return; }
    if (my >= SCREEN_H - 110) return;
    for (const t of [...this.playerTowers, ...this.aiTowers]) {
      if (!t.alive) continue;
      const r = t.rect;
      if (mx >= r.left-5 && mx <= r.right+5 && my >= r.top-5 && my <= r.bottom+5) {
        this._showInvalid(); return;
      }
    }
    const [, UnitClass, cost] = this.CARDS[this.selectedCard];
    if (this.playerElixir < cost) { this._showInvalid(); return; }
    this.playerElixir = Math.max(0, this.playerElixir - cost); // guard: never negative
    this.spawnUnit(UnitClass, mx, my, "player");
  }

  _showInvalid() { this.flashInvalid = true; this.flashTimer = 1.2; }

  // --- Core update loop ---
  update(dt) {
    if (this.state !== STATE_PLAYING) return;
    this.elapsedTime += dt;
    // Flash timer countdown
    if (this.flashInvalid) {
      this.flashTimer -= dt;
      if (this.flashTimer <= 0) { this.flashInvalid = false; this.flashTimer = 0; }
    }
    this._regenElixir(dt);
    // AI decision
    this.aiElixir = this.aiCtrl.update(
      dt, this.aiElixir,
      (cls, x, y, team) => this.spawnUnit(cls, x, y, team),
      this.aiTowers
    );
    this.aiElixir = clamp(this.aiElixir, 0, ELIXIR_MAX);  // clamp guard
    // Tower attacks: each side attacks opposing units + towers
    for (const t of this.playerTowers) t.update(dt, [...this.aiUnits,     ...this.aiTowers    ]);
    for (const t of this.aiTowers)     t.update(dt, [...this.playerUnits, ...this.playerTowers]);
    // Unit updates -- snapshots prevent mid-loop death corruption
    const pu = [...this.playerUnits];
    const au = [...this.aiUnits];
    // Combined alive-tower list shared across all avoidance passes this frame
    const liveTowers = [...this.playerTowers, ...this.aiTowers].filter(t => t.alive);
    for (const u of pu)
      u.update(dt, au, this.aiTowers.filter(t=>t.alive),     pu, liveTowers);
    for (const u of au)
      u.update(dt, pu, this.playerTowers.filter(t=>t.alive), au, liveTowers);
    // Purge dead entities immediately after the frame
    this.playerUnits = this.playerUnits.filter(u => u.alive);
    this.aiUnits     = this.aiUnits.filter(u => u.alive);
    // Win condition
    if      (!this.aiKing.alive)     { this.playerWon = true;  this.state = STATE_GAME_OVER; }
    else if (!this.playerKing.alive) { this.playerWon = false; this.state = STATE_GAME_OVER; }
  }

  draw(ctx) {
    drawBackground(ctx);
    for (const t of [...this.playerTowers, ...this.aiTowers]) t.draw(ctx);
    for (const u of this.aiUnits)     u.draw(ctx);  // AI drawn first
    for (const u of this.playerUnits) u.draw(ctx);  // Player drawn on top
    drawHud(ctx, this.playerElixir, this.aiElixir,
            this.CARDS, this.selectedCard, this.flashInvalid, this.elapsedTime);
    if (this.state === STATE_GAME_OVER) drawGameOver(ctx, this.playerWon);
  }
}

// ============================================================
// 8. MAIN LOOP
// ============================================================
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d");
const game   = new GameState();

// Left click -- scale mouse coords to canvas logical space (handles CSS scaling)
canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  game.handleClick(
    (e.clientX - r.left) * (canvas.width  / r.width),
    (e.clientY - r.top ) * (canvas.height / r.height)
  );
});

// Keyboard: 1/2/3 select card, R restarts after game over
document.addEventListener("keydown", e => game.handleKeydown(e));

// Scroll wheel cycles the selected card; prevent page scroll on canvas
canvas.addEventListener("wheel", e => { e.preventDefault(); game.handleWheel(e); }, { passive: false });

// Dynamic cursor feedback: crosshair in deploy zone, pointer over cards, not-allowed above river
canvas.addEventListener("mousemove", e => {
  const r  = canvas.getBoundingClientRect();
  const my = (e.clientY - r.top) * (canvas.height / r.height);
  canvas.style.cursor = my > SCREEN_H - 110 ? "pointer"
                      : my > RIVER_BOTTOM   ? "crosshair"
                      :                       "not-allowed";
});

// RAF loop -- dt capped at FPS_MAX_DT to handle tab switches / background throttle
let lastTime = null;
function loop(ts) {
  if (lastTime === null) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, FPS_MAX_DT);
  lastTime = ts;
  game.update(dt);
  game.draw(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
