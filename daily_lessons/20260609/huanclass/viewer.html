<!DOCTYPE html>
<html>
<head>
    <title>PDF Slide Viewer</title>
    <style>
        body { font-family: sans-serif; background: #333; color: white; text-align: center; }
        .slide-container { margin: 20px auto; max-width: 1000px; background: #222; padding: 20px; border-radius: 8px; }
        img { width: 100%; height: auto; border: 2px solid #555; }
        h2 { color: #00bcd4; }
    </style>
</head>
<body>
    <h1>The Startup Profit Equation PDF Slides</h1>
    <div class="slide-container">
        <h2>Page 1</h2>
        <img src="images/pdf_pages/page_1.png" alt="Page 1">
    </div>
    <div class="slide-container">
        <h2>Page 2</h2>
        <img src="images/pdf_pages/page_2.png" alt="Page 2">
    </div>
    <div class="slide-container">
        <h2>Page 3</h2>
        <img src="images/pdf_pages/page_3.png" alt="Page 3">
    </div>
    <div class="slide-container">
        <h2>Page 4</h2>
        <img src="images/pdf_pages/page_4.png" alt="Page 4">
    </div>
    <div class="slide-container">
        <h2>Page 5</h2>
        <img src="images/pdf_pages/page_5.png" alt="Page 5">
    </div>
    <div class="slide-container">
        <h2>Page 6</h2>
        <img src="images/pdf_pages/page_6.png" alt="Page 6">
    </div>
    <div class="slide-container">
        <h2>Page 7</h2>
        <img src="images/pdf_pages/page_7.png" alt="Page 7">
    </div>
    <div class="slide-container">
        <h2>Page 8</h2>
        <img src="images/pdf_pages/page_8.png" alt="Page 8">
    </div>
</body>
</html>
